name: 오늘의 시사 만들기

on:
  schedule:
    # 한국 시간 평일 아침 (GitHub는 영국 시간 기준이라 전날). 정각은 붐벼서 늦거나 빠지므로 어중간한 분에 여러 번 걸어 둠.
    # 오늘 학습지가 이미 있으면 몇 초 만에 끝나서 제미나이·유튜브를 쓰지 않음.
    - cron: "17 20 * * 0-4"   # 5:17
    - cron: "13 21 * * 0-4"   # 6:13
    - cron: "7 22 * * 0-4"    # 7:07
    - cron: "47 22 * * 0-4"   # 7:47
    # 가장 확실한 깨우기는 apps-script/wake-github.gs (구글 타이머가 5~6시에 '없을 때만 만들기'를 요청)
  workflow_dispatch:
    inputs:
      mode:
        description: "할 일"
        type: choice
        options:
          - 오늘 것 다시 만들기
          - 없을 때만 만들기
          - 그날 뉴스 숨기기
          - 숨긴 뉴스 다시 보이기
        default: 오늘 것 다시 만들기
      date:
        description: "날짜 (숨기기·다시 보이기 때만, 예: 2026-10-30)"
        required: false

permissions:
  contents: write

concurrency:
  group: today-news
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 준비
        run: pip install feedparser requests beautifulsoup4

      - name: 뉴스 선정 + 학습지 만들기
        if: github.event_name == 'schedule' || inputs.mode == '오늘 것 다시 만들기' || inputs.mode == '없을 때만 만들기'
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
        run: |
          if [ "${{ inputs.mode }}" = "오늘 것 다시 만들기" ]; then
            python scripts/generate.py --force
          else
            python scripts/generate.py
          fi

      - name: 숨기기
        if: inputs.mode == '그날 뉴스 숨기기'
        run: python scripts/generate.py --hide "${{ inputs.date }}"

      - name: 다시 보이기
        if: inputs.mode == '숨긴 뉴스 다시 보이기'
        run: python scripts/generate.py --unhide "${{ inputs.date }}"

      - name: 저장소에 올리기
        if: always()
        run: |
          git config user.name "today-news-bot"
          git config user.email "today-news-bot@users.noreply.github.com"
          git add data
          if git diff --cached --quiet; then
            echo "바뀐 내용 없음"
          else
            git commit -m "오늘의 시사 $(TZ=Asia/Seoul date +%Y-%m-%d)"
            git pull --rebase origin main || true   # 실행 중에 코드가 바뀌어도 올라가게
            git push
          fi
